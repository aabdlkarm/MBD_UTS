version: "3.8"

services:
  postgres_db:
    image: postgres:15
    container_name: postgres_Abdul_Karim
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "22017:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_network
    restart: unless-stopped

  pgadmin_web:
    image: dpage/pgadmin4
    container_name: pgadmin_Abdul_Karim
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "44017:80"
    depends_on:
      - postgres_db
    networks:
      - db_network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  db_network:
    driver: bridge
